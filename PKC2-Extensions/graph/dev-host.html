<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>PKC-Message host simulator — graph extension</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { padding: 8px 12px; background: #111; color: #ddd; display: flex; gap: 12px; align-items: center; }
      header b { color: #6f6; }
      iframe { flex: 1; border: 0; width: 100%; }
      #log { font-family: monospace; font-size: 12px; color: #6cf; }
    </style>
  </head>
  <body>
    <header>
      <b>PKC-Message host simulator</b>
      <label>📂 Container 読込 <input id="file" type="file" accept=".html,.json,.pkc" /></label>
      <span id="log">no container yet</span>
    </header>
    <iframe id="ext" src="./pkc2-graph.html"></iframe>

    <script type="module">
      // Minimal stand-in for the host PKC2's message bridge. It serves the
      // graph extension over PKC-Message v2 (JSON-RPC 2.0):
      //   - responds to `pkc.container.snapshot` requests with the container,
      //   - pushes `pkc.container.changed` when a new container is loaded,
      //   - logs inbound `pkc.graph.nodeSelected` notifications.
      // The real host (PKC2) will mount `mountMessageBridge` and answer the
      // same method; this file documents that contract.
      const iframe = document.getElementById('ext');
      const log = document.getElementById('log');
      let container = null;

      window.addEventListener('message', (ev) => {
        const m = ev.data;
        if (!m || m.jsonrpc !== '2.0') return;
        if (m.method === 'pkc.container.snapshot' && 'id' in m) {
          ev.source.postMessage({ jsonrpc: '2.0', id: m.id, result: { container } }, '*');
        } else if (m.method === 'pkc.graph.nodeSelected') {
          log.textContent = 'node-selected ← ' + (m.params && m.params.lid);
          window.__LAST_SELECTED__ = m.params && m.params.lid;
        }
      });

      function pushContainer(c) {
        container = c;
        log.textContent = `serving "${c.meta?.title}" (${c.entries.length} entries) over PKC-Message`;
        // Live-push to an already-mounted extension.
        iframe.contentWindow.postMessage(
          { jsonrpc: '2.0', method: 'pkc.container.changed', params: { container: c } },
          '*',
        );
      }

      function extractContainer(parsed) {
        const o = parsed && (Array.isArray(parsed.entries) ? parsed : parsed.container);
        return o && Array.isArray(o.entries) ? o : null;
      }

      document.getElementById('file').addEventListener('change', async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const text = await f.text();
        const m = text.match(/<script[^>]*id="pkc-data"[^>]*>([\s\S]*?)<\/script>/i);
        const parsed = JSON.parse(m ? m[1].trim() : text);
        const c = extractContainer(parsed);
        if (c) pushContainer(c);
        else log.textContent = 'container を認識できませんでした';
      });

      // Allow tests / external drivers to inject a container directly.
      window.__pushContainer__ = pushContainer;
    </script>
  </body>
</html>
