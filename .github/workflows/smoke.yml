# PKC2 Smoke — Tier 3-2 (Playwright smoke baseline)
#
# Minimal end-to-end gate: builds the single-HTML artifact and
# verifies one user path (boot → create Text entry → enter editing
# phase) against a real Chromium. Exists to catch regressions that
# the vitest/happy-dom suite structurally can't see — for example
# bundle-time minifier breakage, release-builder slot-injection
# drift, or CSP errors.
#
# Decision (Tier 3-2):
#   - **Separate workflow** from ci.yml. The base CI is sub-1-minute
#     and must stay fast; Playwright adds browser install
#     (~1.5 min) which shouldn't block every tier commit.
#   - Triggered on push to main / release branches + PR to main.
#     Dev branches (claude/**) still get ci.yml; smoke runs before
#     merge.
#   - Runs a single spec (tests/smoke/app-launch.spec.ts). Broader
#     E2E (TIER3_PRIORITIZATION.md C-3) is deferred to Tier 3-3+.
#
# Non-goals: visual regression, cross-browser matrix, video retention.

name: Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    # PKC2 の smoke は v2.3.x stack(PR-V13 で docx + pptxgenjs を bundle に
    # 同梱、+725KB)+ wave-10 系の追加 spec で 250 件超に拡大。
    # CI runner は local より遅く、本体 npm ci + playwright install + 3 種
    # build で約 3min を消費するため、smoke 実行に 15-17min は必要。元の
    # 15min cap だと smoke 完了前に job が timeout-kill される。
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build bundle
        run: npm run build:bundle

      - name: Build release HTML
        run: npm run build:release

      - name: Build manual HTML
        # Phase 4: the manual-launch smoke spec navigates
        # /pkc2-manual.html. It needs the manual artifact present in
        # PKC2-Extensions/ — `scripts/smoke-serve.cjs` routes that
        # directory alongside dist/. See
        # docs/development/manual-build-integration-plan.md §Phase 4.
        run: npm run build:manual

      - name: Run smoke baseline
        run: npm run test:smoke

      # 2026-05-05 user direction:
      #   「GitHub に間違ってもテストデータそのものやプライベートデータが
      #    含まれる可能性があるスクショをアップしないでください」
      #
      # Artifact upload of test-results / playwright-report is REMOVED
      # to guarantee no screenshot or trace.zip ever lands on GitHub.
      # Failure diagnosis stays inside the CI run logs and the
      # developer's local environment.
