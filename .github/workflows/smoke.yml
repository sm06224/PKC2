# PKC2 Smoke — PR-W19 acceleration(Tier 分離 + matrix shard + cache)
#
# 旧 smoke は workers:1 + fullyParallel:false の完全シリアル実行で 271 spec
# が 15-17 min 消費、timeout 25 min を圧迫していた。PR-W19 で以下に再編:
#
# 1. **Tier 分離**(`SMOKE_TIER=a` / `all`):
#    - **Tier-A**(PR blocking、10 spec、< 2 min):boot / kanban / filer /
#      graph / editor / swipe / search / debug / reform comprehensive parity。
#      `pull_request: → main` で必ず走る。
#    - **Tier-B**(main push + schedule 毎晩、261 spec):wave-* / 個別 feature /
#      長い flow。`push: main` と `schedule: '0 18 * * *'` で走る。PR では skip。
# 2. **matrix shard 4 並列**(Tier-B のみ):`--shard=1/4..4/4` で 4 jobs に
#    分散、各 job 内は `workers: 2` で更に 2 並列 → total **8 parallel**。
# 3. **Playwright browser cache**:`~/.cache/ms-playwright` を actions/cache で
#    persist、`npx playwright install` を hit 時に skip → -1.5 min。
# 4. **diagnostic 5 spec を `_archive/` 隔離**:production smoke から exclude。
# 5. **retries: 0**:flake を retry で隠さず即診断。
#
# 期待:
# - PR 時:15-17 min → **2-3 min**(Tier-A 10 spec、browser cache hit、worker 2)
# - main / schedule:15-17 min → **3-5 min**(Tier-B 261 spec、4 shard × 2 worker = 8 parallel)
#
# Non-goals: visual regression、cross-browser matrix、video retention。
# Artifact upload は引き続き禁止(2026-05-05 user direction、private data 保護)。

name: Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 毎晩 18:00 UTC(JST 3:00)に Tier-B 全件を main に対して走らせる。
    # main の状態を毎日 verify、PR で skip した specs の regression を 24h
    # 以内に検出。
    - cron: '0 18 * * *'

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Tier-A:PR blocking 用 small set(10 spec、< 2 min) ───
  tier-a:
    name: Smoke Tier-A (PR gate)
    runs-on: ubuntu-latest
    # pull_request の時だけ走る(push: main / schedule は Tier-B のみ)
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # PR-W19:Playwright chromium binary を cache。`~/.cache/ms-playwright`
      # は GitHub runner 起動ごとに削除されるので、`actions/cache` で persist。
      # cache key には Playwright version を埋め、version 更新時に自動 invalidate。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 壊れた Microsoft apt repo(packages.microsoft.com)がランナーイメージに
      # プリインされており、不定期に不正な署名メタデータ(NOSPLIT / "no longer
      # signed")を配信して `apt-get update` を破壊する既知の再発性インシデントが
      # ある(microsoft/vscode#134123, Azure/azure-cli#28822, playwright#30502 等)。
      # playwright の `--with-deps` / `install-deps` は内部で apt を叩くため巻き
      # 込まれる。smoke に不要な MS 第三者 repo を install 前に除去して apt を
      # 安定化させる(Ubuntu 本体 repo は残すので低リスク)。
      - name: Drop broken Microsoft apt repo (recurring GH runner incident)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli* 2>/dev/null || true
          sudo apt-get update || true

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (cache hit case)
        # cache hit でも apt-get で chromium の system 依存(libnss / libatk 等)は
        # 必要なので、`--with-deps` は run。binary download は cache が hit
        # していれば skip される。
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build bundle
        run: npm run build:bundle

      - name: Build release HTML
        run: npm run build:release

      - name: Build manual HTML
        run: npm run build:manual

      - name: Run smoke Tier-A
        env:
          SMOKE_TIER: a
        run: npm run test:smoke

  # ─── Tier-B:main push + schedule(毎晩)用 full set(261 spec、4 shard 並列) ───
  tier-b:
    name: Smoke Tier-B shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # push: main + schedule のとき走る(pull_request は Tier-A のみ)
    if: github.event_name != 'pull_request'
    timeout-minutes: 15

    strategy:
      fail-fast: false
      # CI parallelism reduction(2026-05-18 user direction「シャードの実行を
      # 2 つずつとかにできない?」):
      # 4 shard 全件並列で各 runner が CPU + IDB / browser process contention
      # に巻き込まれて flake 化していたため、同時 2 shard までに絞る。
      # max-parallel: 2 → shards 1+2 → 3+4 の 2 batch 実行。
      # wall time は ~2x になるが、playwright workers: 1 と組合せて total
      # 同時実行 test 数 = 2 contexts まで、IDB / browser contention を最小化。
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 壊れた Microsoft apt repo(packages.microsoft.com)がランナーイメージに
      # プリインされており、不定期に不正な署名メタデータ(NOSPLIT / "no longer
      # signed")を配信して `apt-get update` を破壊する既知の再発性インシデントが
      # ある(microsoft/vscode#134123, Azure/azure-cli#28822, playwright#30502 等)。
      # playwright の `--with-deps` / `install-deps` は内部で apt を叩くため巻き
      # 込まれる。smoke に不要な MS 第三者 repo を install 前に除去して apt を
      # 安定化させる(Ubuntu 本体 repo は残すので低リスク)。
      - name: Drop broken Microsoft apt repo (recurring GH runner incident)
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure-cli* 2>/dev/null || true
          sudo apt-get update || true

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build bundle
        run: npm run build:bundle

      - name: Build release HTML
        run: npm run build:release

      - name: Build manual HTML
        run: npm run build:manual

      - name: Run smoke Tier-B shard ${{ matrix.shard }}
        # --shard=N/M を Playwright に渡して spec を 4 分割並列実行。各 shard
        # 内は `workers: 2` で更に 2 並列 → total 8 parallel。
        run: npx playwright test --config=tests/smoke/playwright.config.ts --shard=${{ matrix.shard }}/4

  # 2026-05-05 user direction:
  #   「GitHub に間違ってもテストデータそのものやプライベートデータが
  #    含まれる可能性があるスクショをアップしないでください」
  #
  # Artifact upload of test-results / playwright-report is REMOVED
  # to guarantee no screenshot or trace.zip ever lands on GitHub.
  # Failure diagnosis stays inside the CI run logs and the
  # developer's local environment.
